<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152d36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="TheGods 山海行旅：手機橫向單機 RPG，探索、回合戰鬥、分件換裝與離線存檔。"><title>TheGods｜山海行旅</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg"><link rel="apple-touch-icon" href="./assets/icon-192.png"><link rel="stylesheet" href="./styles.css"></head>
<body><main id="game" aria-label="TheGods 單機遊戲"><div id="safe-area-probe" aria-hidden="true"></div><canvas id="world" aria-label="遊戲場景，點擊地面移動"></canvas><div class="vignette"></div>
<header class="hud"><div class="party"><button class="portrait" data-open="gear" aria-label="開啟角色裝備"><canvas id="portrait" width="128" height="128"></canvas><span id="level">3</span></button><div class="vitals"><div class="name"><strong id="hero-name">凌雲</strong><small>劍行者</small><span class="offline-dot" title="單機模式"></span></div><div class="bar hp"><i id="hp-bar"></i><span id="hp-text"></span></div><div class="bar mp"><i id="mp-bar"></i><span id="mp-text"></span></div></div><div class="pet-badge"><span>✦</span><small>靈狐</small></div></div><div class="location"><span class="eyebrow">THE GODS · 山海行旅</span><strong id="scene-name">青嵐鎮</strong><span id="scene-sub">第一章 · 風起青嵐</span></div><div class="top-right"><div class="currency"><span>◈</span><b id="gold">360</b></div><button id="battle-record" class="square battle-record" aria-label="查看本回合戰報" hidden>戰報</button><button class="square" data-open="settings" aria-label="設定與存檔">⚙</button><button class="square" id="sound" aria-label="切換音效">♫</button></div></header>
<div id="minimap" class="minimap" role="button" tabindex="0" aria-label="地圖"><div class="map-art"><svg viewBox="0 0 130 80" aria-hidden="true"><path d="M12 58 50 14 80 20 118 42 92 71 46 60Z" fill="#557d78" opacity=".45"/><path d="M12 58 52 46 67 29 106 40M52 46 66 68" fill="none" stroke="#b9ba95" stroke-width="7"/><path d="M12 58 52 46 67 29 106 40M52 46 66 68" fill="none" stroke="#d7d0ac" stroke-width="2"/><circle cx="67" cy="29" r="4" fill="#e3b868"/><circle id="map-pin" cx="64" cy="50" r="4" fill="#a0f8e1"/></svg></div><span id="map-label">青嵐鎮</span></div>
<aside id="quest-card" class="quest-card"><button id="quest-toggle" aria-label="展開任務"><span class="quest-icon">卷</span><div><small>主線 · 第一章</small><strong>山道的異動</strong></div><span class="chevron">⌃</span></button><p id="quest-short"></p><button id="quest-go" class="text-button">前往目標 <span>↗</span></button></aside>
<div id="battle-log" class="battle-log" role="log" aria-live="polite" hidden></div>
<div id="movement-hint" class="movement-hint"><span>◇</span> 點擊地面移動・點擊人物互動</div>
<nav class="dock" id="explore-dock" aria-label="遊戲選單"><button data-open="map"><span>⌘</span><small>地圖</small></button><button data-open="bag"><span>▣</span><small>行囊</small></button><button class="featured" data-open="gear"><span>⚔</span><small>換裝</small></button><button id="mount"><span>♞</span><small>騎乘</small></button><button data-open="journal"><span>▤</span><small>任務</small></button></nav>
<nav id="combat" class="battle-controls" hidden aria-label="戰鬥指令">
<div class="battle-status"><div id="round-banner" class="round-banner"><span>回合</span><strong id="round-no">01</strong></div><span id="round-state">選擇指令</span><span id="target-hint" aria-live="polite">選擇指令後指定目標</span></div>
<div id="command-buttons" class="command-buttons"></div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="save-indicator" class="save-indicator">◌ 本機存檔</div>
<section id="welcome" class="welcome"><div class="welcome-shade"></div><div class="welcome-content"><span class="eyebrow">THE GODS</span><h1>山海行旅</h1><div class="ornament">── ◇ ──</div><p>一人，一劍。<br>從青嵐山下，走進你的故事。</p><button id="start" class="primary">進入旅程 <span>→</span></button><small>橫向遊玩 · 無需帳號 · 進度儲存於此裝置</small></div><span class="version">單機原型 0.1.6</span></section>
<div id="modal" class="modal" hidden><div class="modal-shade" data-close="true"></div><section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><header><div><span class="eyebrow" id="panel-sub">THE GODS</span><h2 id="panel-title"></h2></div><button id="close-panel" class="close" aria-label="關閉">×</button></header><div id="panel-body"></div></section></div>
<div id="rotate" class="rotate"><span>▱</span><h2>橫放手機，開始旅程</h2><p>將螢幕轉為橫向，讓山海在眼前展開。</p><small>單機進度已保留</small></div>
</main><input id="import-file" type="file" accept="application/json,.json" hidden><script type="module" src="./app.mjs"></script></body></html>
